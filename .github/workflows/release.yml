name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/debug/app-debug.apk \
             "l-entre-deux-${VERSION}-debug.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body: |
            ## Install

            Download the APK below and sideload it on your device.

            **This is a debug build** signed with the standard Android debug key.
            It is suitable for testing. The production release will be distributed
            via F-Droid once submitted.

            ### Sideloading steps
            1. Download `l-entre-deux-*-debug.apk`.
            2. On your Android device, enable **Install unknown apps** for your
               file manager or browser (Settings → Apps → Special app access).
            3. Open the APK file and tap **Install**.
          files: "l-entre-deux-*-debug.apk"
