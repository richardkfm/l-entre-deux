name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="l-entre-deux-${VERSION}-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "${APK}"

          NOTES="## Install

          Download the APK below and sideload it on your device.

          **This is a debug build** signed with the standard Android debug key.
          It is suitable for testing. The production release will be distributed
          via F-Droid once submitted.

          ### Sideloading steps
          1. Download \`${APK}\`.
          2. On your Android device, enable **Install unknown apps** for your
             file manager or browser (Settings → Apps → Special app access).
          3. Open the APK file on your device and tap **Install**."

          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${APK}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "${NOTES}" \
              --draft
          fi
